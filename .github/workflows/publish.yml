name: Publish verified desktop release
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build desktop downloads run ID
        required: true
      tag:
        description: Release tag
        required: true
        default: v1.0.0
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify source build
        id: build
        shell: bash
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > /tmp/build-run.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path('/tmp/build-run.json').read_text())
          assert run['repository']['full_name'] == os.environ['GH_REPO']
          assert run['path'] == '.github/workflows/desktop.yml'
          assert run['head_branch'] == 'main'
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('sha=' + run['head_sha'] + '\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Verify all downloads
        run: |
          python - <<'PY'
          import hashlib, tarfile, zipfile
          from pathlib import Path
          expected = ['editPDFbyAI-macOS-arm64.tar.gz', 'editPDFbyAI-macOS-x64.tar.gz', 'editPDFbyAI-Windows-x64.zip']
          for name in expected:
              matches = list(Path('artifacts').rglob(name))
              assert len(matches) == 1, name
              p = matches[0]
              checksum = p.with_name(name + '.sha256').read_text().split()
              assert checksum == [hashlib.sha256(p.read_bytes()).hexdigest(), name]
              if name.endswith('.zip'):
                  with zipfile.ZipFile(p) as archive:
                      names = archive.namelist()
              else:
                  with tarfile.open(p) as archive:
                      names = archive.getnames()
              for required in ['README.md', 'README.zh-CN.md', 'README.ja.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md']:
                  assert 'editPDFbyAI/' + required in names, (name, required)
              print('Verified:', name)
          assert len(list(Path('artifacts').rglob('*.sha256'))) == 3
          PY
      - name: Publish release
        env:
          BUILD_SHA: ${{ steps.build.outputs.sha }}
        run: |
          test -f "docs/releases/$RELEASE_TAG.md"
          gh release create "$RELEASE_TAG" artifacts/*/* --target "$BUILD_SHA" --title "editPDFbyAI ${RELEASE_TAG#v}" --notes-file "docs/releases/$RELEASE_TAG.md"
